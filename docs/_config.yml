title: pinotdb
description: Python DB-API and SQLAlchemy dialect for Apache Pinot
remote_theme: just-the-docs/just-the-docs

url: https://startreedata.github.io
baseurl: /pinot-dbapi

aux_links:
  "GitHub":
    - "https://github.com/startreedata/pinot-dbapi"
  "PyPI":
    - "https://pypi.org/project/pinotdb/"

aux_links_new_tab: true

heading_anchors: true

nav_sort: case_insensitive

search_enabled: true
search:
  heading_level: 3

footer_content: 'pinotdb is maintained by <a href="https://github.com/startreedata">StartreeData</a>. Distributed under the MIT License.'

back_to_top: true
back_to_top_text: "Back to top"

last_edit_timestamp: true
last_edit_time_format: "%b %e %Y at %I:%M %p"

gh_edit_link: true
gh_edit_link_text: "Edit this page on GitHub"
gh_edit_repository: "https://github.com/startreedata/pinot-dbapi"
gh_edit_branch: "master"
gh_edit_source: docs
gh_edit_view_mode: "tree"

callouts:
  important:
    title: Important
    color: yellow
  note:
    title: Note
    color: blue
  tip:
    title: Tip
    color: green
  warning:
    title: Warning
    color: red

color_scheme: light

plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
